name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked
      - name: Build desktop app
        working-directory: crates/app
        run: dx build --platform desktop --release
      - name: Cache Windows dependencies
        uses: actions/cache@v4
        with:
          path: vendor/win64
          key: win64-${{ hashFiles('models/manifest.json', 'scripts/fetch-win-deps.py') }}
      - name: Fetch Windows dependencies and models
        run: python scripts/fetch-win-deps.py --dest vendor/win64
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $cargoVersion = ($meta.packages | Where-Object { $_.name -eq 'ustt-app' }).version
          if ($cargoVersion -ne $version) {
            throw "tag $version does not match ustt-app $cargoVersion"
          }
          $exe = "target/dx/universal-stt/release/windows/app/universal-stt.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          cargo tree --workspace > dist/DEPENDENCIES.txt
          python scripts/package_release.py `
            --deps vendor/win64 `
            --manifest models/manifest.json `
            --exe $exe `
            --out dist `
            --version $version
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --generate-notes --title "Universal STT $env:GITHUB_REF_NAME"
          }
          gh release upload $env:GITHUB_REF_NAME $zip.FullName dist/SHA256SUMS dist/DEPENDENCIES.txt NOTICE LICENSE --clobber
