[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.11"
edition = "2024"
license = "MIT"
repository = "https://github.com/universal-stt/universal-stt-windows"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
thiserror = "2"
