[package]
name = "ustt-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "universal-stt"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "dep:rfd", "dep:dirs"]
web = ["dioxus/web"]

[dependencies]
chrono.workspace = true
dioxus = { version = "0.7.10" }
futures-timer = "3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
ustt-core = { path = "../core" }
ustt-ui-model = { path = "../ui-model" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
dirs = { version = "6", optional = true }
rfd = { version = "0.15", optional = true }
ustt-media = { path = "../media" }
ustt-pipeline = { path = "../pipeline" }
ustt-export = { path = "../export" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }
chrono = { workspace = true, features = ["wasmbind"] }
console_error_panic_hook = "0.1"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Document", "Element", "HtmlMediaElement"] }
ustt-export = { path = "../export", default-features = false }
uuid = { workspace = true, features = ["js"] }
