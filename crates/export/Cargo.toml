[package]
name = "ustt-export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["office", "audio"]
office = ["dep:docx-rs", "dep:printpdf"]
audio = ["dep:ustt-media", "dep:tempfile"]

[dependencies]
docx-rs = { version = "0.4.22", optional = true }
printpdf = { version = "0.12.8", features = ["html"], optional = true }
ustt-core = { path = "../core" }
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
serde = { workspace = true }
ustt-media = { path = "../media", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
hound = "3"
